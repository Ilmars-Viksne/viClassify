[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "viclassify"
dynamic = ["version"]
description = "Reproducible binary and multiclass classification for numerical tabular datasets"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Ilmārs Vīksne" }]
keywords = ["machine-learning", "classification", "scikit-learn", "tabular-data", "chronological-validation", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "build>=1.2,<2",
  "twine>=7,<8",
]

[project.scripts]
viclassify = "viclassify.cli:main"

[tool.hatch.version]
path = "src/viclassify/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/viclassify"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/viclassify/**",
    "/examples/**",
    "/tests/**",
    "/viclassify_cli.py",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
